{% extends "base.html" %}

{% block title %}Вход — Медзаписи{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1>Вход в систему</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>
        <p class="mt-3">Нет аккаунта? <a href="{% url 'patients:register' %}">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
