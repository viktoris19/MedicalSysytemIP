{% extends "base.html" %}

{% block title %}Пациенты — Медзаписи{% endblock %}

{% block content %}
<h1>Пациенты</h1>
<p class="text-muted">Всего: {{ patients|length }}</p>

<ul class="list-group">
    {% for patient in patients %}
        {% include "patients/includes/patient_card.html" %}
    {% empty %}
        <li class="list-group-item text-muted">Пациентов нет</li>
    {% endfor %}
</ul>
{% endblock %}
